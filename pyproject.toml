[project]
name = "fx-bn"
version = "0.1.0"
description = "Time-varying Bayesian-network-style graph over the 7 major FX pairs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client",
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "pyarrow",
    "graphviz",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fx-bn = "fx_bn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_bn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
