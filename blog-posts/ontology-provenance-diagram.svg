<svg viewBox="0 0 920 510" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="510" fill="#fcfcfb"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">One Shared Provenance Record, Two Honestly-Distinguished Kinds of Fact</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#6f6e6a">fx-pcn's RDF ontology: measurement vs. opinion, both pointing at the same regime</text>

  <!-- CurrencyPair -->
  <rect x="40" y="330" width="190" height="86" rx="8" fill="#eef7ee" stroke="#3a7d3a" stroke-width="1.6"/>
  <text x="135" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f4d1f">fxpcn:CurrencyPair</text>
  <text x="135" y="378" text-anchor="middle" font-size="12" fill="#2c5c2c">fxpcn:label "EUR/USD"</text>
  <text x="135" y="396" text-anchor="middle" font-size="12" fill="#2c5c2c">baseCurrency / quoteCurrency</text>

  <!-- EdgeObservation -->
  <rect x="30" y="90" width="240" height="120" rx="8" fill="#e8f0fe" stroke="#2a56c6" stroke-width="1.6"/>
  <text x="150" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#173a8c">fxpcn:EdgeObservation</text>
  <text x="150" y="136" text-anchor="middle" font-size="11.5" fill="#1c4aa8">MEASUREMENT — the pipeline computed this</text>
  <text x="150" y="158" text-anchor="middle" font-size="12" fill="#1c4aa8">partialCorrelation -0.23</text>
  <text x="150" y="176" text-anchor="middle" font-size="12" fill="#1c4aa8">direction "EUR/USD-&gt;USD/CAD"</text>
  <text x="150" y="194" text-anchor="middle" font-size="12" fill="#1c4aa8">date 2026-07-08</text>

  <!-- prov:Activity (shared hub) -->
  <rect x="355" y="330" width="230" height="120" rx="8" fill="#f0f0ee" stroke="#555" stroke-width="1.6"/>
  <text x="470" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#222">prov:Activity</text>
  <text x="470" y="378" text-anchor="middle" font-size="11.5" fill="#444">one node per regime</text>
  <text x="470" y="400" text-anchor="middle" font-size="12" fill="#444">windowDays 5 · stepDays 1</text>
  <text x="470" y="420" text-anchor="middle" font-size="12" fill="#444">granularity "H1" · fdrAlpha 0.05</text>

  <!-- QualitativeSummaryRun -->
  <rect x="650" y="90" width="240" height="120" rx="8" fill="#fff4e5" stroke="#b5651d" stroke-width="1.6"/>
  <text x="770" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a4a12">fxpcn:QualitativeSummaryRun</text>
  <text x="770" y="136" text-anchor="middle" font-size="11.5" fill="#9a5514">OPINION — an LLM read the measurements</text>
  <text x="770" y="158" text-anchor="middle" font-size="12" fill="#9a5514">llmModel "ollama_chat/glm-5.2:cloud"</text>
  <text x="770" y="176" text-anchor="middle" font-size="12" fill="#9a5514">takeawayBullet "Watch EUR/USD..."</text>
  <text x="770" y="194" text-anchor="middle" font-size="12" fill="#9a5514">date 2026-07-08</text>

  <defs>
    <marker id="arrow-solid" viewBox="0 -5 10 10" refX="9" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,-5L10,0L0,5" fill="#173a8c"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 -5 10 10" refX="9" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,-5L10,0L0,5" fill="#9a5514"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 -5 10 10" refX="9" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,-5L10,0L0,5" fill="#777"/>
    </marker>
  </defs>

  <!-- EdgeObservation -> CurrencyPair (pairA/pairB) -->
  <line x1="150" y1="210" x2="145" y2="330" stroke="#777" stroke-width="1.4" stroke-dasharray="2,3" marker-end="url(#arrow-gray)"/>
  <text x="90" y="270" font-size="11.5" fill="#555">pairA / pairB</text>

  <!-- EdgeObservation -> Activity (wasGeneratedBy, solid) -->
  <line x1="220" y1="210" x2="420" y2="330" stroke="#173a8c" stroke-width="2.2" marker-end="url(#arrow-solid)"/>
  <text x="212" y="275" font-size="12.5" font-weight="700" fill="#173a8c">wasGeneratedBy</text>

  <!-- QualitativeSummaryRun -> Activity (wasInformedBy, dashed) -->
  <line x1="720" y1="210" x2="540" y2="330" stroke="#9a5514" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-dashed)"/>
  <text x="600" y="275" font-size="12.5" font-weight="700" fill="#9a5514">wasInformedBy</text>

  <!-- Legend -->
  <line x1="330" y1="475" x2="360" y2="475" stroke="#173a8c" stroke-width="2.2"/>
  <text x="368" y="479" font-size="11.5" fill="#333">solid = "this fact is the output of that process" (measurement)</text>
  <line x1="330" y1="497" x2="360" y2="497" stroke="#9a5514" stroke-width="2.2" stroke-dasharray="7,5"/>
  <text x="368" y="501" font-size="11.5" fill="#333">dashed = "this used output from that process" (opinion)</text>
</svg>
