[project]
name = "fx-pcn"
version = "0.1.0"
description = "Time-varying partial-correlation network with Granger-causal edge direction, over the 7 major FX pairs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client",
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "pyarrow",
    "graphviz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs>=3.0.5.260730",
]

[project.scripts]
fx-pcn = "fx_pcn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_pcn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
# Not pinned to the project's `requires-python` floor (3.11): the installed
# numpy version's bundled stubs use PEP 695 syntax that requires 3.12+, so
# mypy checks against whichever interpreter runs it instead.
packages = ["fx_pcn"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*", "graphviz.*", "influxdb_client.*"]
ignore_missing_imports = true
